// Scroll tracking para GTM
function useScrollTracking() {
  const [tracked, setTracked] = React.useState({});

  React.useEffect(() => {
    const handleScroll = () => {
      const sections = ['que-es', 'carta-dia', 'como-funciona', 'comunidad', 'faq', 'conseguir'];
      sections.forEach((id) => {
        if (tracked[id]) return;
        const el = document.getElementById(id);
        if (el) {
          const rect = el.getBoundingClientRect();
          if (rect.top < window.innerHeight * 0.5) {
            window.dataLayer = window.dataLayer || [];
            window.dataLayer.push({ event: 'scroll_to_section', section: id });
            setTracked((prev) => ({ ...prev, [id]: true }));
          }
        }
      });
    };
    window.addEventListener('scroll', handleScroll);
    return () => window.removeEventListener('scroll', handleScroll);
  }, [tracked]);
}

function App() {

  };
